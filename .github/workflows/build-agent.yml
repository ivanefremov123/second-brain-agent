name: Build agent

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  PYTHONUTF8: "1"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-agent.txt pyinstaller

      - name: Tests
        run: |
          python tests/test_launch_selection.py
          python tests/test_deferred_confirmation.py

      - name: Build
        run: pyinstaller --noconfirm packaging/SecondBrainAgent.spec

      - name: Selftest of the built exe
        shell: pwsh
        run: |
          $p = Start-Process dist/SecondBrainAgent/SecondBrainAgent.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "selftest failed: $($p.ExitCode)"; exit 1 }

      - name: Pack
        shell: pwsh
        run: Compress-Archive -Path dist/SecondBrainAgent -DestinationPath SecondBrainAgent-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SecondBrainAgent-windows-x64
          path: SecondBrainAgent-windows-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SecondBrainAgent-windows-x64.zip
